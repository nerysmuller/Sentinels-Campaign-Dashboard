<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinels to the Starry Skies</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Spectral:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Spectral', serif;
            background: linear-gradient(180deg, #0a0a1a 0%, #1a1a2e 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated starfield background */
        .stars, .twinkling {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .stars {
            background: #000 url('https://i.imgur.com/YKY28eT.png') repeat top center;
            z-index: 0;
        }

        .twinkling {
            background: transparent url('https://i.imgur.com/XYMF4ca.png') repeat top center;
            z-index: 1;
            animation: move-twink-back 200s linear infinite;
        }

        @keyframes move-twink-back {
            from {background-position: 0 0;}
            to {background-position: -10000px 5000px;}
        }

        /* Landing content */
        .landing-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            padding: 40px;
            animation: fadeInScale 2s ease-out;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            font-weight: 700;
            color: #d4af37;
            text-shadow: 
                0 0 20px rgba(212, 175, 55, 0.8),
                0 0 40px rgba(212, 175, 55, 0.5),
                0 0 60px rgba(212, 175, 55, 0.3);
            margin-bottom: 20px;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #d4af37, #f4e5a1, #d4af37, #b8941e);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-family: 'Spectral', serif;
            font-size: 1.5rem;
            color: #b8b8d0;
            margin-bottom: 50px;
            font-style: italic;
            text-shadow: 0 0 10px rgba(184, 184, 208, 0.3);
        }

        .enter-button {
            position: relative;
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            padding: 20px 60px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
            border: 3px solid #d4af37;
            color: #d4af37;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            overflow: hidden;
            box-shadow: 
                0 0 20px rgba(212, 175, 55, 0.3),
                inset 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .enter-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent);
            transition: left 0.6s ease;
        }

        .enter-button:hover::before {
            left: 100%;
        }

        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 30px rgba(212, 175, 55, 0.6),
                inset 0 0 30px rgba(212, 175, 55, 0.2);
            border-color: #f4e5a1;
            color: #f4e5a1;
        }

        .enter-button:active {
            transform: translateY(-1px);
        }

        /* Quote */
        .quote {
            font-family: 'Spectral', serif;
            font-size: 1rem;
            color: #8b8ba0;
            margin-top: 40px;
            font-style: italic;
            opacity: 0.8;
        }

        /* Transition overlay */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Celestial sweep effect */
        .sweep-beam {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%,
                rgba(212, 175, 55, 0.1) 30%,
                rgba(212, 175, 55, 0.3) 50%,
                rgba(212, 175, 55, 0.1) 70%,
                transparent 100%
            );
            z-index: 10000;
            animation: sweep 1.5s ease-in-out;
        }

        @keyframes sweep {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.2rem;
            }
            .enter-button {
                font-size: 1rem;
                padding: 15px 40px;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="twinkling"></div>
    
    <div class="landing-container">
        <h1 class="main-title">Sentinels to the Starry Skies</h1>
        <p class="subtitle">A Tale of Fallen Celestrians</p>
        <button class="enter-button" id="enterButton">Click to Begin Your Journey</button>
        <p class="quote">"In darkness, we are the light. In chaos, we are the order."</p>
    </div>

    <div class="transition-overlay" id="transitionOverlay"></div>

    <script>
        document.getElementById('enterButton').addEventListener('click', function() {
            // Activate transition
            const overlay = document.getElementById('transitionOverlay');
            overlay.classList.add('active');

            // Create sweep beam effect
            const beam = document.createElement('div');
            beam.className = 'sweep-beam';
            document.body.appendChild(beam);

            // Navigate after animation to the main hub
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 1500);
        });

        // Prevent accidental navigation
        window.addEventListener('beforeunload', function(e) {
            // Don't prevent if we're intentionally navigating
            if (document.getElementById('transitionOverlay').classList.contains('active')) {
                return;
            }
        });
    </script>
</body>
</html>

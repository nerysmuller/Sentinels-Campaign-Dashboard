<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinels of the Celestial Realm - Campaign Hub</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/fantasy-theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lora:ital,wght@0,400;0,600;1,400&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Celestial Particles Background -->
    <div class="particle-container" id="particles"></div>
    <div class="stars-background"></div>
    
    <!-- Header -->
    <header class="fantasy-header celestial-theme">
        <div class="header-glow"></div>
        
        <div class="title-container">
            <div class="celestial-ornament left">
                <i class="fas fa-star"></i>
            </div>
            
            <h1 class="illuminated-title">
                <span class="title-line-1">Sentinels of the</span>
                <span class="title-line-2">Celestial Realm</span>
            </h1>
            
            <div class="celestial-ornament right">
                <i class="fas fa-star"></i>
            </div>
        </div>
        
        <p class="subtitle">
            <i class="fas fa-feather-alt"></i>
            Where Angels Walk Among Mortals
            <i class="fas fa-feather-alt"></i>
        </p>
        
        <nav class="medieval-nav">
            <a href="#home" class="nav-link active" data-page="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#observatory" class="nav-link" data-page="observatory">
                <i class="fas fa-moon"></i>
                <span>Observatory</span>
            </a>
            <a href="#world-map" class="nav-link" data-page="world-map">
                <i class="fas fa-map"></i>
                <span>World Map</span>
            </a>
            <a href="#lore" class="nav-link" data-page="lore">
                <i class="fas fa-book-open"></i>
                <span>Lore</span>
            </a>
            <a href="#celestrians" class="nav-link" data-page="celestrians">
                <i class="fas fa-user-shield"></i>
                <span>Celestrians</span>
            </a>
            <a href="#npcs" class="nav-link" data-page="npcs">
                <i class="fas fa-users"></i>
                <span>NPCs</span>
            </a>
            <a href="#locations" class="nav-link" data-page="locations">
                <i class="fas fa-landmark"></i>
                <span>Locations</span>
            </a>
            <a href="#timeline" class="nav-link" data-page="timeline">
                <i class="fas fa-hourglass-half"></i>
                <span>Timeline</span>
            </a>
            <a href="#bestiary" class="nav-link" data-page="bestiary">
                <i class="fas fa-dragon"></i>
                <span>Bestiary</span>
            </a>
            <a href="#player-portal" class="nav-link player-portal-link" data-page="player-portal">
                <i class="fas fa-shield-alt"></i>
                <span>Player Portal</span>
            </a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="content-wrapper">
        <!-- Content loads dynamically here -->
    </main>

    <!-- Footer -->
    <footer class="fantasy-footer celestial-footer">
        <div class="celestial-seal">
            <i class="fas fa-star-of-life"></i>
        </div>
        <p class="footer-text">
            <span class="dm-signature">Crafted by the Dungeon Master</span>
            <span class="separator">✦</span>
            <span class="campaign-year">May the Celestrians Guide Your Path</span>
        </p>
        <div class="footer-flourish"></div>
    </footer>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner">
            <i class="fas fa-star spinning-star"></i>
            <i class="fas fa-star spinning-star delay-1"></i>
            <i class="fas fa-star spinning-star delay-2"></i>
            <p>Ascending to the Observatory...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/particles.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
